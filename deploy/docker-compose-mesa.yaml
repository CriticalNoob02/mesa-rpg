# Stack da Mesa RPG: mesa-server + mesa-web + mesa-proxy (nginx). Pensada para
# stack via Portainer na vpszinha, em cima das stacks do Forja: usa o Postgres
# `forja-db` (database `mesa`, usuário próprio) e o NPM da stack infra, todos na
# rede externa `shared-services`.
#
# ATENÇÃO (Portainer): variável da UI só chega no container se estiver mapeada
# em `environment:` abaixo.
#
# PORTAS: nenhum serviço publica porta no host. O NPM aponta o proxy host
# (ex.: mesa.arcanemarket.com.br, com "Websockets Support" LIGADO) para
# `mesa-proxy:80` pelo nome. `ports:` é NAT do Docker e não passa pelo
# ufw/DOCKER-USER — publicar "só pra testar" abre para o mundo.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mesa-server:
    image: "${MESA_REGISTRY:?defina MESA_REGISTRY, ex. ghcr.io/dono}/mesa-rpg-server:${MESA_VERSION:-latest}"
    pull_policy: ${MESA_PULL_POLICY:-always}
    restart: unless-stopped
    container_name: mesa-server
    logging: *logging
    environment:
      PORT: 4010
      # postgresql://mesa:<senha>@forja-db:5432/mesa — host = nome do serviço na rede
      DATABASE_URL: ${MESA_DATABASE_URL:?defina MESA_DATABASE_URL}
      # Origem exata do front (https://mesa.arcanemarket.com.br). Nunca "*".
      CORS_ORIGINS: ${MESA_ORIGIN:?defina MESA_ORIGIN}
      # Um proxy na frente do servidor que conta: o mesa-proxy entrega o IP real
      # num X-Forwarded-For de um valor só (ver real_ip no nginx abaixo).
      TRUST_PROXY: 1
      ASSETS_DIR: /data/assets
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - mesa_assets:/data/assets
    networks:
      - shared-services
    expose:
      - "4010"

  mesa-web:
    image: "${MESA_REGISTRY}/mesa-rpg-web:${MESA_VERSION:-latest}"
    pull_policy: ${MESA_PULL_POLICY:-always}
    restart: unless-stopped
    container_name: mesa-web
    logging: *logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    networks:
      - shared-services
    expose:
      - "3010"

  # O NPM aponta o domínio → mesa-proxy:80. Aqui: /api e /socket.io no servidor
  # (WebSocket), o resto no front.
  mesa-proxy:
    image: "nginx:${NGINX_VERSION:-1.27-alpine}"
    restart: unless-stopped
    container_name: mesa-proxy
    logging: *logging
    depends_on:
      - mesa-server
      - mesa-web
    networks:
      - shared-services
    expose:
      - "80"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80;
            server_name _;
            server_tokens off;
            # Upload de mapa/handout: até 15 MB no servidor; folga para o cabeçalho.
            client_max_body_size 16m;

            # DNS interno do Docker com variável: re-resolve a cada request, então
            # redeploy de um upstream (IP novo) não vira 502.
            resolver 127.0.0.11 valid=10s ipv6=off;

            # IP real do jogador vem do NPM (mesma rede). O servidor recebe um só.
            set_real_ip_from 172.16.0.0/12;
            set_real_ip_from 10.0.0.0/8;
            set_real_ip_from 192.168.0.0/16;
            real_ip_header X-Forwarded-For;

            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            location /socket.io/ {
                set $$server mesa-server:4010;
                proxy_pass http://$$server;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$remote_addr;
                # Mesa aberta por horas: não derrubar o WebSocket ocioso.
                proxy_read_timeout 1h;
                proxy_send_timeout 1h;
            }

            location /api/ {
                set $$server mesa-server:4010;
                proxy_pass http://$$server;
            }

            location / {
                set $$web mesa-web:3010;
                proxy_pass http://$$web;
            }
        }
        EOF
        exec nginx -g 'daemon off;'

volumes:
  # Imagens enviadas (mapas, ambiente, handouts). Backup: copiar
  # /var/lib/docker/volumes/mesa_mesa_assets/_data junto com o dump do banco.
  mesa_assets:

networks:
  shared-services:
    external: true
